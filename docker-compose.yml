version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: discord-db
    restart: always
    environment:
      POSTGRES_USER: discord
      POSTGRES_PASSWORD: discord123
      POSTGRES_DB: discord
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: discord-backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    environment:
      DB_URL: postgres://discord:discord123@postgres:5432/discord
      JWT_SECRET: SWILL_SECRET_KEY_2026
      CLIENT_URL: http://localhost:3000
      PORT: 5000
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: discord-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:5000
      REACT_APP_SOCKET_URL: http://localhost:5000

volumes:
  pgdata:
